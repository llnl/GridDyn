variables:
  griddyn.std: 14
  griddyn.build_type: Release
  griddyn.options:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  - job: macOS_latest
    pool:
      vmImage: "macOS-latest"
    steps:
      # -----------------------
      # Install dependencies
      # -----------------------

      - bash: brew install boost
        displayName: Install boost

      # -----------------------
      # Configure GRIDDYN
      # -----------------------
      - task: CMake@1
        inputs:
          cmakeArgs: -DGRIDDYN_BUILD_TESTS=ON -DGRIDDYN_SUITESPARSE_FORCE_SUBPROJECT=ON ..
        displayName: "Configure GridDyn"

      # -----------------------
      # Build GridDyn
      # -----------------------
      - bash: cmake --build . --config Release
        displayName: "Build GridDyn"
        workingDirectory: build

      # -----------------------
      # Test GridDyn
      # -----------------------
      - bash: ctest --output-on-failure --timeout 480 -C Release -L "Continuous"
        displayName: "Test GridDyn"
        workingDirectory: build

  - job: macOS_15
    pool:
      vmImage: "macOS-15"
    steps:
      # -----------------------
      # Install dependencies
      # -----------------------

      - bash: brew install boost suite-sparse
        displayName: Install boost

      # -----------------------
      # Configure GRIDDYN
      # -----------------------
      - task: CMake@1
        inputs:
          cmakeArgs: -DGRIDDYN_BUILD_TESTS=ON ..
        displayName: "Configure GridDyn"

      # -----------------------
      # Build GridDyn
      # -----------------------
      - bash: cmake --build . --config Release
        displayName: "Build GridDyn"
        workingDirectory: build

      # -----------------------
      # Test GridDyn
      # -----------------------
      - bash: ctest --output-on-failure --timeout 480 -C Release -L "Continuous"
        displayName: "Test GridDyn"
        workingDirectory: build
