parameters:
  - name: compareWindowsBuilds
    displayName: Compare Windows Ninja and MSBuild timings
    type: boolean
    default: false

variables:
  griddyn.std: 14
  griddyn.build_type: Release
  griddyn.options:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  griddyn.windows_latest_flags: >-
    -DGRIDDYN_ENABLE_FMI=OFF
    -DGRIDDYN_BUILD_CXX_SHARED_LIBRARY=ON
    -DGRIDDYN_ENABLE_OPTIMIZATION_LIBRARY=ON

jobs:
  - job: macOS_latest
    pool:
      vmImage: "macOS-latest"
    steps:
      # -----------------------
      # Install dependencies
      # -----------------------

      - bash: brew install boost
        displayName: Install boost

      # -----------------------
      # Configure GRIDDYN
      # -----------------------
      - task: CMake@1
        inputs:
          cmakeArgs: -DGRIDDYN_BUILD_TESTS=ON -DGRIDDYN_SUITESPARSE_FORCE_SUBPROJECT=ON ..
        displayName: "Configure GridDyn"

      # -----------------------
      # Build GridDyn
      # -----------------------
      - bash: cmake --build . --config Release
        displayName: "Build GridDyn"
        workingDirectory: build

      # -----------------------
      # Test GridDyn
      # -----------------------
      - bash: ctest --output-on-failure --timeout 480 -C Release -L "Continuous"
        displayName: "Test GridDyn"
        workingDirectory: build

  - job: macOS_15
    pool:
      vmImage: "macOS-15"
    steps:
      # -----------------------
      # Install dependencies
      # -----------------------

      - bash: brew install boost suite-sparse
        displayName: Install boost

      # -----------------------
      # Configure GRIDDYN
      # -----------------------
      - task: CMake@1
        inputs:
          cmakeArgs: -DGRIDDYN_BUILD_TESTS=ON ..
        displayName: "Configure GridDyn"

      # -----------------------
      # Build GridDyn
      # -----------------------
      - bash: cmake --build . --config Release
        displayName: "Build GridDyn"
        workingDirectory: build

      # -----------------------
      # Test GridDyn
      # -----------------------
      - bash: ctest --output-on-failure --timeout 480 -C Release -L "Continuous"
        displayName: "Test GridDyn"
        workingDirectory: build
  # - job: Docker
  #   variables:
  #     griddyn.options:
  #   pool:
  #     v1mImage: "ubuntu-latest"
  #   strategy:
  #     matrix:
  #       helics:
  #         containerImage: helics/helics:builder
  #         griddyn.options: -DGRIDDYN_ENABLE_HELICS_EXECUTABLE=ON
  #   container: $[ variables['containerImage'] ]
  #   steps:
  #     - template: azure-build.yml
  #     - template: azure-test.yml

  - template: azure-windows.yml
    parameters:
      jobName: Windows_VSlatest_64bit
      displayName: Windows VSlatest-64bit
      imageName: windows-latest
      extraFlags: ${{ variables['griddyn.windows_latest_flags'] }}
      timeoutInMinutes: 90
      buildGenerator: Ninja

  - ${{ if or(parameters.compareWindowsBuilds, eq(variables['Build.SourceBranch'], 'refs/heads/codex/windows-ninja-benchmark')) }}:
      - template: azure-windows.yml
        parameters:
          jobName: Windows_VSlatest_Ninja_2
          displayName: Windows VSlatest Ninja parallel 2
          imageName: windows-latest
          extraFlags: ${{ variables['griddyn.windows_latest_flags'] }}
          timeoutInMinutes: 90
          buildGenerator: Ninja
          buildParallel: 2
          artifactName: installer-windows-latest-ninja-2

      - template: azure-windows.yml
        parameters:
          jobName: Windows_VSlatest_MSBuild_4
          displayName: Windows VSlatest MSBuild parallel 4
          imageName: windows-latest
          extraFlags: ${{ variables['griddyn.windows_latest_flags'] }}
          timeoutInMinutes: 90
          artifactName: installer-windows-latest-msbuild-4

      - template: azure-windows.yml
        parameters:
          jobName: Windows_VSlatest_MSBuild_2
          displayName: Windows VSlatest MSBuild parallel 2
          imageName: windows-latest
          extraFlags: ${{ variables['griddyn.windows_latest_flags'] }}
          timeoutInMinutes: 90
          buildParallel: 2
          artifactName: installer-windows-latest-msbuild-2

  - template: azure-windows.yml
    parameters:
      jobName: Windows_VS2022_64bit
      displayName: Windows VS2022-64bit
      imageName: windows-2022
      extraFlags: "-DGRIDDYN_ENABLE_FMI=ON"
