parameters:
  - name: jobName
    type: string
  - name: displayName
    type: string
  - name: imageName
    type: string
  - name: extraFlags
    type: string
  - name: timeoutInMinutes
    type: number
    default: 60
  - name: buildGenerator
    type: string
    default: MSBuild
    values:
      - MSBuild
      - Ninja
  - name: buildParallel
    type: number
    default: 4
  - name: artifactName
    type: string
    default: ""
  - name: dependsOn
    type: object
    default: []
  - name: dependencyCache
    type: string
    default: "Off"
    values:
      - "Off"
      - Cold
      - Warm

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      vmImage: ${{ parameters.imageName }}
    variables:
      vsArch: x64
      extraFlags: ${{ parameters.extraFlags }}
      dependencyLauncherFlag: ""
      ${{ if ne(parameters.dependencyCache, 'Off') }}:
        SCCACHE_DIR: $(Pipeline.Workspace)/sccache-dependencies
        SCCACHE_IDLE_TIMEOUT: "0"
      cmakeFlags: >-
        -DGRIDDYN_ENABLE_PACKAGE_BUILD=ON
        -DGRIDDYN_BUILD_TESTS=ON
        -DGRIDDYN_HDF5_USE_MSVC_PROBE_PRESETS=ON
        -DGRIDDYN_SUITESPARSE_FORCE_SUBPROJECT=ON
      BOOST_ROOT: $(Pipeline.Workspace)/ci-libs/boost
      BOOST_URL: https://sourceforge.net/projects/boost/files/boost/1.90.0/boost_1_90_0.tar.bz2/download

    steps:
      # -----------------------
      # Install dependencies
      # -----------------------
      - bash: |
          submodules=(
            ThirdParty/containers
            ThirdParty/concurrency
            ThirdParty/utilities
            ThirdParty/spdlog
            ThirdParty/googletest
            ThirdParty/units
            ThirdParty/sundials
            ThirdParty/hdf5
            ThirdParty/pugixml
            ThirdParty/tomlplusplus
            ThirdParty/yaml-cpp
            ThirdParty/suitesparse-cmake
          )
          if [[ " $EXTRAFLAGS " == *" -DGRIDDYN_ENABLE_OPTIMIZATION_LIBRARY=ON "* ]]; then
            submodules+=(ThirdParty/highs)
          fi
          git submodule update --init --checkout --depth 1 --jobs 4 -- "${submodules[@]}"
        displayName: Fetch pinned submodules
        workingDirectory: $(Build.SourcesDirectory)

      - task: Cache@2
        inputs:
          path: $(BOOST_ROOT)
          key: '"boost-1.90.0"'
          cacheHitVar: BOOST_CACHE_RESTORED
        # A cache restore failure should fall through to the dependency install.
        continueOnError: true
        displayName: Restore Boost cache

      - bash: |
          cd "$(mktemp -d)"
          curl --location --output "download.tar.bz2" "$BOOST_URL"
          tar xfj "download.tar.bz2"
          mkdir -p "$BOOST_ROOT"
          cp -r boost_*/* "$BOOST_ROOT"
        condition: ne(variables.BOOST_CACHE_RESTORED, 'true')
        displayName: Install Boost

      - bash: choco install nsis --yes --limit-output
        condition: eq( variables['Agent.OS'], 'Windows_NT' )
        displayName: Install NSIS

      - ${{ if ne(parameters.dependencyCache, 'Off') }}:
          - pwsh: |
              $release = 'v0.20.1'
              $package = "sccache-$release-x86_64-pc-windows-msvc"
              $archive = Join-Path '$(Agent.TempDirectory)' "$package.zip"
              $hash = 'ca500a01139e9af8d5f5a5e69b6a0dd941ed79ed3399a91cc35bba484fe732fa'
              Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/$release/$package.zip" -OutFile $archive
              if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $hash) {
                  throw 'The sccache download does not match its pinned SHA-256.'
              }
              Expand-Archive -LiteralPath $archive -DestinationPath '$(Agent.TempDirectory)'
              $toolDirectory = Join-Path '$(Agent.TempDirectory)' $package
              & (Join-Path $toolDirectory 'sccache.exe') --version
              Write-Host "##vso[task.prependpath]$toolDirectory"
              Write-Host '##vso[task.setvariable variable=dependencyLauncherFlag]-DGRIDDYN_DEPENDENCY_COMPILER_LAUNCHER=sccache'
              New-Item -ItemType Directory -Force -Path '$(SCCACHE_DIR)' | Out-Null
            displayName: Install sccache

          - task: Cache@2
            inputs:
              path: $(SCCACHE_DIR)
              key: '"sccache-windows-dependencies" | "$(Build.BuildId)"'
              cacheHitVar: DEPENDENCY_CACHE_RESTORED
            displayName: Restore dependency compiler cache

          - pwsh: |
              $expected = '${{ parameters.dependencyCache }}' -eq 'Warm'
              $actual = $env:DEPENDENCY_CACHE_RESTORED
              if ($actual -ne $expected.ToString()) {
                  throw "Expected ${{ parameters.dependencyCache }} compiler cache restore status $expected. Got '$actual'."
              }
            displayName: Verify dependency cache state

      # -----------------------
      # Configure GRIDDYN
      # -----------------------
      - bash: |
          echo "BOOST_ROOT=$BOOST_ROOT"
          env
        displayName: Show environment info
      - ${{ if eq(parameters.buildGenerator, 'Ninja') }}:
          - pwsh: |
              $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
              $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              if ($LASTEXITCODE -ne 0 -or !$installation) {
                  throw 'No Visual Studio installation with x64 MSVC was found.'
              }
              $vsDevCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
              Write-Host "##vso[task.setvariable variable=VS_DEVCMD]$vsDevCmd"
            displayName: Find x64 MSVC tools

          - script: |
              call "$(VS_DEVCMD)" -no_logo -arch=$(vsArch) -host_arch=x64
              if errorlevel 1 exit /b 1
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl "-DBOOST_INSTALL_PATH=$(BOOST_ROOT)" $(cmakeFlags) $(extraFlags) $(dependencyLauncherFlag)
            displayName: "Configure GridDyn"
            workingDirectory: $(Build.SourcesDirectory)

          - script: |
              call "$(VS_DEVCMD)" -no_logo -arch=$(vsArch) -host_arch=x64
              if errorlevel 1 exit /b 1
              cmake --build . --parallel ${{ parameters.buildParallel }}
            displayName: "Build GridDyn"
            workingDirectory: build

      - ${{ else }}:
          - task: CMake@1
            inputs:
              cmakeArgs: >-
                -A $(vsArch)
                -DBOOST_INSTALL_PATH=$(BOOST_ROOT)
                $(cmakeFlags) $(extraFlags) ..
            displayName: "Configure GridDyn"

          - bash: cmake --build . --config Release --parallel ${{ parameters.buildParallel }}
            displayName: "Build GridDyn"
            workingDirectory: build

      - ${{ if ne(parameters.dependencyCache, 'Off') }}:
          - pwsh: |
              sccache --show-stats
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              sccache --stop-server
            displayName: Report compiler cache statistics

      # -----------------------
      # Package GridDyn
      # -----------------------
      - bash: |
          cpack_dir="$(which cmake)"
          cpack_dir="${cpack_dir%/cmake}"
          "${cpack_dir}/cpack" -G "NSIS" -C Release -B "$PWD/installer-output"
        displayName: "Package GridDyn"
        workingDirectory: build

      - task: CopyFiles@2
        inputs:
          sourceFolder: "$(Build.SourcesDirectory)/build/installer-output"
          contents: "*.exe"
          TargetFolder: "$(Build.ArtifactStagingDirectory)"

      - task: PublishBuildArtifacts@1
        inputs:
          pathtoPublish: "$(Build.ArtifactStagingDirectory)"
          artifactName: ${{ coalesce(parameters.artifactName, format('installer-{0}', parameters.imageName)) }}

      # -----------------------
      # Test GridDyn
      # -----------------------
      - bash: ctest --output-on-failure --timeout 480 -C Release -L "Continuous"
        displayName: "Test GridDyn"
        workingDirectory: build
