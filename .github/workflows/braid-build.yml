name: Braid Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circleci-braid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-xbraid:
    name: XBraID
    runs-on: ubuntu-latest
    container: helics/buildenv:gcc15-builder

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Braid dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends liblapacke-dev

      - name: Build XBraID
        shell: bash
        run: |
          ./scripts/xbraid_build.sh
          test -f "${GITHUB_WORKSPACE}/../xbraid/braid/braid.h"
          test -f "${GITHUB_WORKSPACE}/../xbraid/braid/libbraid.a"

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DGRIDDYN_ENABLE_MPI=ON \
            -DGRIDDYN_ENABLE_OPENMP=OFF \
            -DGRIDDYN_ENABLE_EXTRA_SOLVERS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_BRAID_SOLVER=ON \
            "-DBRAID_INSTALL_DIR=${GITHUB_WORKSPACE}/../xbraid/braid"
          grep -Fq "loadExtraSolvers();" build/src/gridDynLoader/libraryLoader.cpp

      - name: Build
        shell: bash
        run: cmake --build build --parallel 4

      - name: Test braid example
        shell: bash
        run: build/bin/gridDynMain examples/braid_examples/179busDynamicTest_BraidNoEvents.xml
