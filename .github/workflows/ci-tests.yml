name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            c_compiler: gcc-14
            cxx_compiler: g++-14
            extra_packages: ""
            cxx_flags: ""
            optimization_flag: "-DGRIDDYN_ENABLE_OPTIMIZATION_LIBRARY=OFF"
            highs_flag: "-DGRIDDYN_ENABLE_HIGHS=OFF"
          - name: Clang 18
            c_compiler: clang-18
            cxx_compiler: clang++-18
            extra_packages: "libomp-18-dev"
            cxx_flags: "-Werror"
            optimization_flag: "-DGRIDDYN_ENABLE_OPTIMIZATION_LIBRARY=ON"
            highs_flag: "-DGRIDDYN_ENABLE_HIGHS=ON"

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libsuitesparse-dev \
          libboost-dev \
          ${{ matrix.c_compiler }} \
          ${{ matrix.cxx_compiler }} \
          ${{ matrix.extra_packages }}

    - name: Configure
      shell: bash
      run: >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
        -DCMAKE_CXX_FLAGS=${{ matrix.cxx_flags }}
        -DBUILD_TESTING=ON
        -DGRIDDYN_BUILD_TESTS=ON
        ${{ matrix.optimization_flag }}
        ${{ matrix.highs_flag }}
        -DGRIDDYN_ENABLE_FMI=OFF
        -DGRIDDYN_ENABLE_HELICS_EXECUTABLE=OFF

    - name: Build
      run: cmake --build build --parallel

    - name: Run continuous tests
      run: ctest --test-dir build --output-on-failure -L Continuous

  build-and-test-windows:
    name: Windows MSVC + HiGHS
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install Boost headers
      shell: bash
      env:
        BOOST_VERSION: "1.88.0"
      run: |
        python - <<'PY'
        import os
        import tarfile
        import urllib.request
        from pathlib import Path

        version = os.environ["BOOST_VERSION"]
        archive_name = f"boost_{version.replace('.', '_')}.tar.gz"
        boost_dir_name = archive_name.removesuffix(".tar.gz")
        boost_root = Path(".boost") / boost_dir_name

        if not boost_root.exists():
            url = f"https://archives.boost.io/release/{version}/source/{archive_name}"
            archive_path = Path(".boost") / archive_name
            archive_path.parent.mkdir(exist_ok=True)
            urllib.request.urlretrieve(url, archive_path)
            with tarfile.open(archive_path, "r:gz") as archive:
                archive.extractall(archive_path.parent)

        host_boost_root = boost_root.resolve().as_posix()
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"BOOST_ROOT={host_boost_root}\n")
            env.write(f"BOOST_INSTALL_PATH={host_boost_root}\n")
        PY

    - name: Configure
      shell: pwsh
      run: >
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        -DBUILD_TESTING=ON
        -DGRIDDYN_BUILD_TESTS=ON
        -DGRIDDYN_ENABLE_OPTIMIZATION_LIBRARY=ON
        -DGRIDDYN_ENABLE_HIGHS=ON
        -DGRIDDYN_ENABLE_KLU=ON
        -DGRIDDYN_SUITESPARSE_FORCE_SUBPROJECT=ON
        -DGRIDDYN_USE_SUITESPARSE_STATIC_LIBRARY=ON
        -DGRIDDYN_ENABLE_FMI=OFF
        -DGRIDDYN_ENABLE_HELICS_EXECUTABLE=OFF

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Run continuous tests
      run: ctest --test-dir build -C Release --output-on-failure -L Continuous

  build-and-test-macos:
    name: macOS + HiGHS
    runs-on: macos-14
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install Boost headers
      shell: bash
      env:
        BOOST_VERSION: "1.88.0"
      run: |
        python - <<'PY'
        import os
        import tarfile
        import urllib.request
        from pathlib import Path

        version = os.environ["BOOST_VERSION"]
        archive_name = f"boost_{version.replace('.', '_')}.tar.gz"
        boost_dir_name = archive_name.removesuffix(".tar.gz")
        boost_root = Path(".boost") / boost_dir_name

        if not boost_root.exists():
            url = f"https://archives.boost.io/release/{version}/source/{archive_name}"
            archive_path = Path(".boost") / archive_name
            archive_path.parent.mkdir(exist_ok=True)
            urllib.request.urlretrieve(url, archive_path)
            with tarfile.open(archive_path, "r:gz") as archive:
                archive.extractall(archive_path.parent)

        host_boost_root = boost_root.resolve().as_posix()
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"BOOST_ROOT={host_boost_root}\n")
            env.write(f"BOOST_INSTALL_PATH={host_boost_root}\n")
        PY

    - name: Configure
      shell: bash
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTING=ON
        -DGRIDDYN_BUILD_TESTS=ON
        -DGRIDDYN_ENABLE_OPTIMIZATION_LIBRARY=ON
        -DGRIDDYN_ENABLE_HIGHS=ON
        -DGRIDDYN_ENABLE_KLU=ON
        -DGRIDDYN_SUITESPARSE_FORCE_SUBPROJECT=ON
        -DGRIDDYN_USE_SUITESPARSE_STATIC_LIBRARY=ON
        -DGRIDDYN_ENABLE_FMI=OFF
        -DGRIDDYN_ENABLE_HELICS_EXECUTABLE=OFF

    - name: Build
      run: cmake --build build --parallel 4

    - name: Run continuous tests
      run: ctest --test-dir build --output-on-failure -L Continuous
