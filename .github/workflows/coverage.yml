name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            lcov \
            libsuitesparse-dev \
            libboost-dev

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Coverage
          -DCMAKE_C_COMPILER=gcc-15
          -DCMAKE_CXX_COMPILER=g++-15
          -DBUILD_TESTING=ON
          -DGRIDDYN_BUILD_TESTS=ON
          -DGRIDDYN_ENABLE_CODE_COVERAGE_TEST=ON
          -DGRIDDYN_ENABLE_HELICS_EXECUTABLE=OFF

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Run continuous tests
        shell: bash
        run: ctest --test-dir build --output-on-failure -L Continuous

      - name: Prepare coverage report
        shell: bash
        working-directory: build
        run: |
          lcov \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors gcov,mismatch,inconsistent \
            --capture \
            --directory . \
            --output-file coverage.info
          lcov \
            --remove coverage.info \
            --ignore-errors inconsistent,unused \
            '/usr/*' \
            '*/test/*' \
            '*/ThirdParty/*' \
            '*/examples/*' \
            '*/interfaces/*' \
            --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: coverage-report
          path: build/coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          files: build/coverage.info
          fail_ci_if_error: true
          name: coverage-gcc15-ubuntu2604
          token: ${{ secrets.CODECOV_TOKEN }}
