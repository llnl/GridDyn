name: Python Library

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build Python wheel
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsuitesparse-dev \
            libboost-dev \
            gcc-15 \
            g++-15
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Build wheel
        shell: bash
        env:
          CMAKE_ARGS: >-
            -DCMAKE_C_COMPILER=gcc-15
            -DCMAKE_CXX_COMPILER=g++-15
            -DCMAKE_BUILD_TYPE=Release
        run: python -m build --wheel

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Check extension dependencies
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import griddyn._core as core

          extension = core.__file__
          dependencies = subprocess.check_output(["ldd", extension], text=True)
          print(dependencies)
          if "minizip" in dependencies.lower():
              raise SystemExit("Python extension must not depend on shared minizip")
          PY

      - name: Run Python tests
        shell: bash
        run: python -m pytest python/tests
