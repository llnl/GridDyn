[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.5.0"]
build-backend = "scikit_build_core.build"

[project]
name = "griddyn"
version = "0.11.3"
description = "Python bindings for GridDyn"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Philip Top", email = "top1@llnl.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
]
keywords = [
    "power systems",
    "simulation",
    "grid dynamics",
    "power flow",
    "co-simulation",
    "science",
    "python",
]

[project.urls]
Homepage = "https://github.com/LLNL/GridDyn"
Repository = "https://github.com/LLNL/GridDyn"
Issues = "https://github.com/LLNL/GridDyn/issues"
Changelog = "https://github.com/LLNL/GridDyn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

sdist.exclude = [
    "**/doc/**",
    "**/docs/**",
    "**/Doc/**",
    "**/Docs/**",
    "ThirdParty/sundials/test/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/CSparse/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/Example/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/GraphBLAS/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/LAGraph/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/MATLAB_Tools/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/Mongoose/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/ParU/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/RBio/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/SPEX/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/TestConfig/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/bin/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/include/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/lib/**",
    "ThirdParty/suitesparse-cmake/SuiteSparse/ssget/**",
    "ThirdParty/networking/ThirdParty/asio/asio/src/tests/**",
    "ThirdParty/networking/ThirdParty/NetIF/tests/**",
    "ThirdParty/networking/ThirdParty/nlohmann_json/tests/**",
    "ThirdParty/units/test/**",
    "ThirdParty/yaml-cpp/test/**",
    "test/test_files/validation_tests/**",
    "test/test_files/fmi_export_tests/**",
]

sdist.include = [
    "ThirdParty/Zlib/zlib-1.3.2/zconf.h",
]

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# The build targets to use when building the project. Empty builds the default target.
build.targets = ["griddyn_python_core"]

# The components to install. If empty, all default components are installed.
install.components = ["python"]

# Build stable ABI wheels for CPython 3.13+
wheel.py-api = "cp313"

cmake.version = ">=3.26.1"
cmake.args = [
    "-DBUILD_SHARED_LIBS=OFF",
    "-DBUILD_STATIC_LIBS=ON",
    "-DGRIDDYN_BUILD_PYTHON_LIBRARY=ON",
    "-DGRIDDYN_BUILD_CXX_SHARED_LIBRARY=OFF",
    "-DGRIDDYN_BUILD_TESTS=OFF",
    "-DGRIDDYN_ENABLE_FMI=OFF",
    "-DGRIDDYN_ENABLE_HELICS_EXECUTABLE=OFF",
    "-DGRIDDYN_ENABLE_OPENMP=OFF",
    "-DGRIDDYN_SUITESPARSE_FORCE_SUBPROJECT=ON",
    "-DGRIDDYN_USE_SUITESPARSE_STATIC_LIBRARY=ON",
]

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1
skip = [
    "*-win32",
    "*-musllinux_*",
]

# Run pytest to ensure that the package was correctly built
test-command = "pytest {project}/python/tests"
test-requires = "pytest"

# Align the wheel deployment target with GridDyn's macOS CI baseline.
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "14.0"

[tool.cibuildwheel.linux]
before-all = """
set -eux
if command -v yum >/dev/null 2>&1; then
    yum install -y blas-devel lapack-devel
elif command -v dnf >/dev/null 2>&1; then
    dnf install -y blas-devel lapack-devel
elif command -v microdnf >/dev/null 2>&1; then
    microdnf install -y blas-devel lapack-devel
elif command -v apt-get >/dev/null 2>&1; then
    apt-get update
    apt-get install -y libblas-dev liblapack-dev
fi
"""

[tool.cibuildwheel.windows]
archs = ["AMD64"]
